version: "3.8"
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thalavadi
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/thalavadi
    ports:
      - "4000:4000"

  # Optional: self-hosted, open-source SMS gateway (https://www.kannel.org).
  # Requires a GSM modem/SIM attached to the host, or a Kannel "smsc" config
  # pointed at a provider that speaks the SMPP protocol. Uncomment to use;
  # otherwise the API just logs OTP codes to its console.
  # kannel:
  #   image: kannel/kannel
  #   restart: unless-stopped
  #   ports:
  #     - "13013:13013"
  #   volumes:
  #     - ./kannel/kannel.conf:/etc/kannel/kannel.conf

volumes:
  db_data:
